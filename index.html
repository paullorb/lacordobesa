<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f6f4ef" />
    <meta name="description" content="A simple place to begin." />
    <title>Lacordobesa — A place to begin</title>
    <style>
      :root { color-scheme: light; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #20231f; background: #f6f4ef; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 2rem; }
      main { width: min(100%, 720px); text-align: center; }
      .mark { display: inline-grid; place-items: center; width: 48px; height: 48px; margin-bottom: 2rem; border: 1px solid #d8d5cc; border-radius: 50%; font-size: 1.1rem; color: #68745c; }
      p { margin: 0 0 1rem; color: #68745c; font-size: .75rem; font-weight: 650; letter-spacing: .16em; text-transform: uppercase; }
      h1 { margin: 0; font-size: clamp(2.8rem, 9vw, 5.5rem); font-weight: 520; letter-spacing: -.065em; line-height: 1; }
      .intro { margin: 1.5rem auto 0; max-width: 420px; color: #72736d; font-size: 1.05rem; line-height: 1.7; }
      footer { position: fixed; bottom: 1.5rem; color: #9a9991; font-size: .78rem; }
    </style>
  </head>
  <body>
    <main>
      <span class="mark" aria-hidden="true">L</span>
      <p>A place to begin</p>
      <h1>Something<br />good starts here.</h1>
      <div class="intro">A simple landing page, ready for what comes next.</div>
    </main>
    <footer>© <span id="year"></span> Lacordobesa</footer>
    <script>document.getElementById('year').textContent = new Date().getFullYear();</script>
  </body>
</html>
