# The whole test suite, once a day and on demand.
#
# Why a daily run at all: this repository has no CI history, and the browser suite rotted precisely
# because nothing ran it. Twelve of its tests had been failing for three commits against a selector a
# UI change had removed, and the suite only skips rather than fails when it cannot reach a server, so
# nobody noticed. A scheduled run is the thing that would have caught it the next morning.
#
# The run is also the canary for things no commit can break but the world can: a Supabase project
# paused for inactivity, a rotated local stack configuration, an Instagram token expiring (60 days), a Graph API
# version Meta retires, or a migration applied to the live database but never committed.
name: Tests

on:
  schedule:
    # 05:10 UTC, which is 06:10 or 07:10 in Frankfurt: long before the shop opens, so a red canary
    # is read with coffee rather than during service. Minute 10 because GitHub queues everything
    # scheduled on the hour.
    - cron: "10 5 * * *"
  workflow_dispatch:
    inputs:
      suites:
        description: "Which suites to run"
        type: choice
        default: all
        options: [all, check, database, browser]
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # One group per branch, and nothing in it is cancelled. `cancel-in-progress` cancels the whole
  # *workflow run*, and job-level `cancel-in-progress: false` cannot save a job once its run is
  # gone: a push to a pull request would kill the database job between a mutation and its cleanup
  # hook, leaving fixtures in the shared database. The hermetic `check` job supersedes its own
  # earlier run in a group of its own instead, which is the only job where a cancel costs nothing.
  # A scheduled run is never superseded either: a nightly cancelled by a push looks identical to a
  # nightly that was never run.
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  # Node 22.18 is the floor (tests/require-node.mjs: type stripping and module.registerHooks). 24 is
  # the version the suite is developed against.
  NODE_VERSION: "24"

jobs:
  # ---------------------------------------------------------------- lint, types, unit tests
  # Hermetic: no database, no browser, no secrets. This job must pass for anyone, including a fork.
  check:
    if: ${{ github.event_name != 'workflow_dispatch' || contains(fromJSON('["all","check"]'), inputs.suites) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      # The one job that may be cancelled: it writes nothing, so a superseded run costs only time.
      group: tests-check-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --prefer-offline

      # `npm run lint` is oxlint --deny-warnings, so its findings are *warnings* and the exit code is
      # the only honest signal. Grepping the output for "error" reports a false pass and has already
      # put a broken main in place once (CLAUDE.md).
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests, with coverage
        run: npm run test:unit:coverage | tee /tmp/unit.log

      # A suite that runs nothing exits 0. coverage.test.ts guards the source side of that; this
      # guards the runner side, so "0 tests, all green" can never be a passing build.
      - name: Assert the unit suite actually ran
        run: node .github/assert-ran.mjs /tmp/unit.log 300

  # ---------------------------------------------------------------- local Supabase, database and browser suites
  # Each runner gets a fresh disposable database. No shared project or credentials are required.
  local:
    if: ${{ github.event_name != 'workflow_dispatch' || contains(fromJSON('["all","database","browser"]'), inputs.suites) }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RUN_DATABASE: ${{ github.event_name != 'workflow_dispatch' || contains(fromJSON('["all","database"]'), inputs.suites) }}
      RUN_BROWSER: ${{ github.event_name != 'workflow_dispatch' || contains(fromJSON('["all","browser"]'), inputs.suites) }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - uses: supabase/setup-cli@v1
        with:
          version: 2.105.0
      - run: npm ci --prefer-offline
      - name: Start local Supabase and apply migrations and seeds
        run: supabase start

      - name: Build with the local database
        run: node scripts/with-local-supabase.mjs npm run build

      - name: Database tests
        if: env.RUN_DATABASE == 'true'
        run: npm run test:integration | tee /tmp/integration.log
      - name: Assert the database suite actually ran
        if: env.RUN_DATABASE == 'true'
        run: node .github/assert-ran.mjs /tmp/integration.log 175

      - name: Install the browsers
        if: env.RUN_BROWSER == 'true'
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Start the site
        if: env.RUN_BROWSER == 'true'
        run: |
          npm run dev > /tmp/dev.log 2>&1 &
          for _ in $(seq 1 90); do
            curl -sf -o /dev/null http://localhost:3000/ && exit 0
            sleep 2
          done
          echo "::error::the dev server never came up"
          cat /tmp/dev.log
          exit 1
      - name: Browser tests
        if: env.RUN_BROWSER == 'true'
        run: npm run test:e2e | tee /tmp/e2e.log
      - name: Assert the browser suite actually ran
        if: env.RUN_BROWSER == 'true'
        run: node .github/assert-ran.mjs /tmp/e2e.log 600
      - name: The dev server's own log, when something failed
        if: failure()
        run: if [ -f /tmp/dev.log ]; then tail -60 /tmp/dev.log; else echo "the dev server was never started"; fi
