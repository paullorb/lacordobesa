# The whole test suite, once a day and on demand.
#
# Why a daily run at all: this repository has no CI history, and the browser suite rotted precisely
# because nothing ran it. Twelve of its tests had been failing for three commits against a selector a
# UI change had removed, and the suite only skips rather than fails when it cannot reach a server, so
# nobody noticed. A scheduled run is the thing that would have caught it the next morning.
#
# The run is also the canary for things no commit can break but the world can: a Supabase project
# paused for inactivity, a rotated staging key, an Instagram token expiring (60 days), a Graph API
# version Meta retires, or a migration applied to the live database but never committed.
name: Tests

on:
  schedule:
    # 05:10 UTC, which is 06:10 or 07:10 in Frankfurt: long before the shop opens, so a red canary
    # is read with coffee rather than during service. Minute 10 because GitHub queues everything
    # scheduled on the hour.
    - cron: "10 5 * * *"
  workflow_dispatch:
    inputs:
      suites:
        description: "Which suites to run"
        type: choice
        default: all
        options: [all, check, database, browser]
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # Supersede an earlier run of the same branch, but never a scheduled one: a nightly result that
  # was cancelled by a push looks identical to a nightly that was never run.
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Node 22.18 is the floor (tests/require-node.mjs: type stripping and module.registerHooks). 24 is
  # the version the suite is developed against.
  NODE_VERSION: "24"

jobs:
  # ---------------------------------------------------------------- lint, types, unit tests
  # Hermetic: no database, no browser, no secrets. This job must pass for anyone, including a fork.
  check:
    if: ${{ github.event_name != 'workflow_dispatch' || contains(fromJSON('["all","check"]'), inputs.suites) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --prefer-offline

      # `npm run lint` is oxlint --deny-warnings, so its findings are *warnings* and the exit code is
      # the only honest signal. Grepping the output for "error" reports a false pass and has already
      # put a broken main in place once (CLAUDE.md).
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests, with coverage
        run: npm run test:unit:coverage | tee /tmp/unit.log

      # A suite that runs nothing exits 0. coverage.test.ts guards the source side of that; this
      # guards the runner side, so "0 tests, all green" can never be a passing build.
      - name: Assert the unit suite actually ran
        run: node .github/assert-ran.mjs /tmp/unit.log 300

  # ---------------------------------------------------------------- the database suite
  database:
    if: ${{ github.event_name != 'workflow_dispatch' || contains(fromJSON('["all","database"]'), inputs.suites) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # These tests write to the staging project and clean up after themselves. Two runs at once would
    # book against one another's `request_reservation` allowance (15 an hour, site-wide) and sweep
    # each other's rows, so they queue instead of overlapping. Never cancel-in-progress here: a
    # cancelled run is a run that left its fixtures behind.
    concurrency:
      group: staging-database
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --prefer-offline

      - name: Write .env.staging.local from the repository secrets
        id: creds
        env:
          STAGING_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          STAGING_PUBLISHABLE_KEY: ${{ secrets.STAGING_PUBLISHABLE_KEY }}
          STAGING_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SERVICE_ROLE_KEY }}
          STAGING_DB_URL: ${{ secrets.STAGING_DB_URL }}
          STAGING_STAFF_USER: ${{ secrets.STAGING_STAFF_USER }}
          STAGING_STAFF_PASS: ${{ secrets.STAGING_STAFF_PASS }}
        run: node .github/write-env.mjs

      - name: Database tests
        if: steps.creds.outputs.configured == 'true'
        run: npm run test:integration | tee /tmp/integration.log

      - name: Assert the database suite actually ran
        if: steps.creds.outputs.configured == 'true'
        run: node .github/assert-ran.mjs /tmp/integration.log 150

      # A pull request from a fork has no secrets and must not be blocked by that. A scheduled run
      # with no secrets is a canary watching nothing, which is worse than a red build.
      - name: Refuse to call a skipped canary green
        if: steps.creds.outputs.configured != 'true' && github.event_name != 'pull_request'
        run: |
          echo "::error::The database suite had no staging credentials, so it tested nothing."
          echo "Add these repository secrets (values are in .env.staging.local):" >> "$GITHUB_STEP_SUMMARY"
          echo '`STAGING_SUPABASE_URL`, `STAGING_PUBLISHABLE_KEY`, `STAGING_SERVICE_ROLE_KEY`, `STAGING_DB_URL`, `STAGING_STAFF_USER`, `STAGING_STAFF_PASS`' >> "$GITHUB_STEP_SUMMARY"
          exit 1

  # ---------------------------------------------------------------- the browser suite
  browser:
    if: ${{ github.event_name != 'workflow_dispatch' || contains(fromJSON('["all","browser"]'), inputs.suites) }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # token-routes.test.mjs arranges a reservation and an order in staging, so this shares the queue
    # with the database job rather than racing it for the same allowance.
    concurrency:
      group: staging-database
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --prefer-offline

      - name: Write .env.local and .env.staging.local from the repository secrets
        id: creds
        env:
          STAGING_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          STAGING_PUBLISHABLE_KEY: ${{ secrets.STAGING_PUBLISHABLE_KEY }}
          STAGING_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SERVICE_ROLE_KEY }}
          STAGING_DB_URL: ${{ secrets.STAGING_DB_URL }}
          STAGING_STAFF_USER: ${{ secrets.STAGING_STAFF_USER }}
          STAGING_STAFF_PASS: ${{ secrets.STAGING_STAFF_PASS }}
        run: node .github/write-env.mjs

      # `npm install` does not fetch browsers. Only the three engines the suite can drive; the matrix
      # (npm run test:matrix) is not part of this workflow, it takes minutes per project.
      - name: Install the browsers
        if: steps.creds.outputs.configured == 'true'
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Start the site
        if: steps.creds.outputs.configured == 'true'
        run: |
          npm run dev > /tmp/dev.log 2>&1 &
          # The suite skips rather than fails when nothing is listening, so waiting is what keeps
          # this job from reporting a green run of nothing.
          for _ in $(seq 1 90); do
            curl -sf -o /dev/null http://localhost:3000/ && exit 0
            sleep 2
          done
          echo "::error::the dev server never came up"
          cat /tmp/dev.log
          exit 1

      - name: Browser tests
        if: steps.creds.outputs.configured == 'true'
        run: npm run test:e2e | tee /tmp/e2e.log

      - name: Assert the browser suite actually ran
        if: steps.creds.outputs.configured == 'true'
        run: node .github/assert-ran.mjs /tmp/e2e.log 600

      - name: The dev server's own log, when something failed
        if: failure() && steps.creds.outputs.configured == 'true'
        run: tail -60 /tmp/dev.log

      - name: Refuse to call a skipped canary green
        if: steps.creds.outputs.configured != 'true' && github.event_name != 'pull_request'
        run: |
          echo "::error::The browser suite had no staging credentials, so it tested nothing."
          exit 1
