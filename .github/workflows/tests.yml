# The whole test suite, once a day and on demand.
#
# Why a daily run at all: this repository has no CI history, and the browser suite rotted precisely
# because nothing ran it. Twelve of its tests had been failing for three commits against a selector a
# UI change had removed, and the suite only skips rather than fails when it cannot reach a server, so
# nobody noticed. A scheduled run is the thing that would have caught it the next morning.
#
# The run is also the canary for things no commit can break but the world can: a Supabase project
# paused for inactivity, a rotated staging key, an Instagram token expiring (60 days), a Graph API
# version Meta retires, or a migration applied to the live database but never committed.
name: Tests

on:
  schedule:
    # 05:10 UTC, which is 06:10 or 07:10 in Frankfurt: long before the shop opens, so a red canary
    # is read with coffee rather than during service. Minute 10 because GitHub queues everything
    # scheduled on the hour.
    - cron: "10 5 * * *"
  workflow_dispatch:
    inputs:
      suites:
        description: "Which suites to run"
        type: choice
        default: all
        options: [all, check, database, browser]
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # One group per branch, and nothing in it is cancelled. `cancel-in-progress` cancels the whole
  # *workflow run*, and job-level `cancel-in-progress: false` cannot save a job once its run is
  # gone: a push to a pull request would kill the staging job between a mutation and its cleanup
  # hook, leaving fixtures in the shared database. The hermetic `check` job supersedes its own
  # earlier run in a group of its own instead, which is the only job where a cancel costs nothing.
  # A scheduled run is never superseded either: a nightly cancelled by a push looks identical to a
  # nightly that was never run.
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  # Node 22.18 is the floor (tests/require-node.mjs: type stripping and module.registerHooks). 24 is
  # the version the suite is developed against.
  NODE_VERSION: "24"

jobs:
  # ---------------------------------------------------------------- lint, types, unit tests
  # Hermetic: no database, no browser, no secrets. This job must pass for anyone, including a fork.
  check:
    if: ${{ github.event_name != 'workflow_dispatch' || contains(fromJSON('["all","check"]'), inputs.suites) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      # The one job that may be cancelled: it writes nothing, so a superseded run costs only time.
      group: tests-check-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --prefer-offline

      # `npm run lint` is oxlint --deny-warnings, so its findings are *warnings* and the exit code is
      # the only honest signal. Grepping the output for "error" reports a false pass and has already
      # put a broken main in place once (CLAUDE.md).
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests, with coverage
        run: npm run test:unit:coverage | tee /tmp/unit.log

      # A suite that runs nothing exits 0. coverage.test.ts guards the source side of that; this
      # guards the runner side, so "0 tests, all green" can never be a passing build.
      - name: Assert the unit suite actually ran
        run: node .github/assert-ran.mjs /tmp/unit.log 300

  # ---------------------------------------------------------------- the suites that touch staging
  # Deliberately one job rather than two.
  #
  # Both the database suite and the browser suite write to the staging project, so they must not run
  # at the same time: they would spend each other's `request_reservation` allowance (15 an hour,
  # site-wide) and sweep each other's fixtures. The first attempt gave them a job each and a shared
  # `concurrency` group to serialise them, which does not work: GitHub keeps only **one** pending job
  # per group, so as soon as a third contender appears (a push while a pull request is still running)
  # the waiting one is cancelled, and a cancelled suite is indistinguishable from one that was never
  # run. One job holds one slot, which is the thing that actually serialises.
  staging:
    if: ${{ github.event_name != 'workflow_dispatch' || contains(fromJSON('["all","database","browser"]'), inputs.suites) }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    concurrency:
      group: staging
      # Never cancel: a cancelled run is one that left its fixtures in the staging database.
      cancel-in-progress: false
    env:
      RUN_DATABASE: ${{ github.event_name != 'workflow_dispatch' || contains(fromJSON('["all","database"]'), inputs.suites) }}
      RUN_BROWSER: ${{ github.event_name != 'workflow_dispatch' || contains(fromJSON('["all","browser"]'), inputs.suites) }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --prefer-offline

      - name: Write .env.local and .env.staging.local from the repository secrets
        id: creds
        env:
          STAGING_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          STAGING_PUBLISHABLE_KEY: ${{ secrets.STAGING_PUBLISHABLE_KEY }}
          STAGING_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SERVICE_ROLE_KEY }}
          STAGING_DB_URL: ${{ secrets.STAGING_DB_URL }}
          STAGING_STAFF_USER: ${{ secrets.STAGING_STAFF_USER }}
          STAGING_STAFF_PASS: ${{ secrets.STAGING_STAFF_PASS }}
        run: node .github/write-env.mjs

      # `check` never builds, and there are no preview deployments (vercel.json), so without this a
      # build-only break (a prerender reading the clock, a route type) was first found by the
      # production deploy of main. Needs the staging credentials: the public pages prerender from
      # the database.
      - name: Production build
        if: steps.creds.outputs.configured == 'true'
        run: npm run build

      # ---- the database suite, first because it is the fast one and the browser suite is pointless
      # if the database it reads is broken.
      - name: Database tests
        if: steps.creds.outputs.configured == 'true' && env.RUN_DATABASE == 'true'
        run: npm run test:integration | tee /tmp/integration.log
      - name: Assert the database suite actually ran
        if: steps.creds.outputs.configured == 'true' && env.RUN_DATABASE == 'true'
        # 175 of 180, deliberately tight. schema.test.mjs is nine tests that skip when the database
        # cannot be reached, and the direct Supabase host is IPv6 only, which a runner does not have:
        # a loose floor would let those nine disappear and still report green. Raise this as the
        # suite grows; it is meant to notice a suite getting smaller.
        run: node .github/assert-ran.mjs /tmp/integration.log 175

      # ---- the browser suite
      # `npm install` does not fetch browsers. Only the three engines the suite drives; the device
      # matrix (npm run test:matrix) is not part of this workflow, it takes minutes per project.
      - name: Install the browsers
        if: steps.creds.outputs.configured == 'true' && env.RUN_BROWSER == 'true'
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Start the site
        if: steps.creds.outputs.configured == 'true' && env.RUN_BROWSER == 'true'
        run: |
          npm run dev > /tmp/dev.log 2>&1 &
          # The suite skips rather than fails when nothing is listening, so waiting is what keeps
          # this job from reporting a green run of nothing.
          for _ in $(seq 1 90); do
            curl -sf -o /dev/null http://localhost:3000/ && exit 0
            sleep 2
          done
          echo "::error::the dev server never came up"
          cat /tmp/dev.log
          exit 1

      - name: Browser tests
        if: steps.creds.outputs.configured == 'true' && env.RUN_BROWSER == 'true'
        run: npm run test:e2e | tee /tmp/e2e.log
      - name: Assert the browser suite actually ran
        if: steps.creds.outputs.configured == 'true' && env.RUN_BROWSER == 'true'
        run: node .github/assert-ran.mjs /tmp/e2e.log 600

      - name: The dev server's own log, when something failed
        if: failure() && steps.creds.outputs.configured == 'true'
        # A failure before "Start the site" leaves no log, and a red step here would hide the real one.
        run: if [ -f /tmp/dev.log ]; then tail -60 /tmp/dev.log; else echo "the dev server was never started"; fi

      # A pull request from a fork has no secrets and must not be blocked by that. A scheduled run
      # with no secrets is a canary watching nothing, which is worse than a red build.
      - name: Refuse to call a skipped canary green
        if: steps.creds.outputs.configured != 'true' && github.event_name != 'pull_request'
        run: |
          echo "::error::The staging suites had no credentials, so they tested nothing."
          echo "Add these repository secrets (values are in .env.staging.local):" >> "$GITHUB_STEP_SUMMARY"
          echo '`STAGING_SUPABASE_URL`, `STAGING_PUBLISHABLE_KEY`, `STAGING_SERVICE_ROLE_KEY`, `STAGING_DB_URL`, `STAGING_STAFF_USER`, `STAGING_STAFF_PASS`' >> "$GITHUB_STEP_SUMMARY"
          exit 1
